set -g default-terminal "tmux-256color"
# Explicitly start panes with the user's shell so tmux-continuum/macOS
# auto-started servers do not depend on launchd's shell choice. This does not
# force login shells; interactive shell startup still comes from .bashrc/.zshrc.
set -g default-command 'exec "${SHELL:-/bin/sh}"'

# Advertise 24-bit (true-color) RGB support to applications running inside
# tmux when the outer terminal supports it. Both the RGB and Tc capabilities
# are honored by tmux >=2.2; older tmux just ignores the override silently.
# Patterns cover the common modern terminals (alacritty, kitty, foot, wezterm,
# iTerm2 via `xterm-256color`/`tmux-256color`, gnome-terminal, etc.).
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",alacritty:Tc"
set -ga terminal-overrides ",foot:Tc"
%if "#{>=:#{version},3.2}"
set -as terminal-features ",xterm-256color:RGB:usstyle"
set -as terminal-features ",tmux-256color:RGB:usstyle"
%endif

# Make mouse useful in copy mode
setw -g mouse on

# Scroll History
set -g history-limit 50000
set -s buffer-limit 100

# Set ability to capture on start and restore on exit window data when running an application
setw -g alternate-screen on

# Lower escape timing for quicker response to scroll-buffer access and vi mode changes.
set -s escape-time 10
#bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

set -g focus-events on
set -g set-clipboard external

# Use Vim shortcuts
setw -g mode-keys vi
setw -g automatic-rename on
setw -g automatic-rename-format '#{pane_current_command} #{b:pane_current_path}'
set -g renumber-windows on

%if "#{>=:#{version},3.2}"
setw -g remain-on-exit failed
%endif

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind e choose-tree -Zw

# In vi copy-mode, send `y`-selected text to the system clipboard.
# This is intentionally redundant with `set-clipboard external`: OSC 52 handles
# capable terminals/remotes, while pbcopy preserves explicit macOS copy behavior.
# Uses pbcopy (macOS); on Linux replace with `xclip -selection clipboard`
# or `wl-copy` depending on the display server.
if-shell "command -v pbcopy >/dev/null" \
  "bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'"

# Bind ctrl-l to clear history and screen
bind -n C-l send-keys C-l \; send-keys -R \; clear-history \;

# Allow OSC 52 / OSC 8 / image protocol passthrough so iTerm2 image protocol,
# clipboard escapes, and similar work inside tmux. Requires tmux >= 3.3.
%if "#{>=:#{version},3.3}"
set-option -g allow-passthrough on
%endif

# Make `Ctrl+B R` reload the config file
unbind r
bind r source-file ~/.tmux.conf

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins"
set -g @resurrect-processes 'ssh nvim vim htop top less man'
set -g @resurrect-dir "$HOME/.tmux/resurrect"
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
# On first save/boot setup, macOS may ask for iTerm2/Terminal Automation
# approval because tmux-continuum installs a launchd startup integration.
set -g @continuum-boot 'on'
set -g @continuum-boot-options 'iterm'

if-shell -b '[ -f "$HOME/.tmux/plugins/tpm/tpm" ]' \
  'run-shell "$HOME/.tmux/plugins/tpm/tpm"'
