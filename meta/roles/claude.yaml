# The optional Claude role pulls in the public Bun role so Bun-based Claude
# extensions and tooling can run without a separate setup.
- depends:
    - bun

- apt:
    - nodejs
    - npm

- link:
    ~/.aliases/claude.sh: home_files/.aliases/claude.sh

- shell:
  -
    command: helpers/claude_setup.sh
    stdout: true
    stdin: true
    stderr: true
