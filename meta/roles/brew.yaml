- shell:
    -
     command: helpers/brew_setup.sh # Brew initialisation
     stdout: true
     stdin: true
     stderr: true

- brew:
    - coreutils # GNU core utilities; provides `gls` used by the `ll` alias in home_files/.aliases/common.sh
    - gnu-sed   # GNU sed; macOS' BSD sed lacks `-r`, has different `-i` semantics, and rejects GNU-only patterns
    - wget      # macOS does not ship wget; .wgetrc lives in home_files/
    - bat       # Used by `alias cat='bat'` in home_files/.aliases/common.sh (guarded by command -v)

- cask:
    - vlc
    - font-jetbrains-mono-nerd-font # Nerd-Font-patched JetBrains Mono for powerline/file-tree glyphs
